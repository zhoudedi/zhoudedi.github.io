<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我们的六周年 💗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #fef9f3;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #444;
      line-height: 1.8;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #e75480;
      letter-spacing: 3px;
    }
    .letter {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(231, 84, 128, 0.1);
      font-size: 1rem;
      white-space: pre-line;
      text-align: left;
    }
    .signature {
      margin-top: 1.5rem;
      font-style: italic;
      text-align: right;
    }
    .heart {
      font-size: 1.4rem;
      margin: 0.8rem 0;
      color: #e75480;
    }
    @media (max-width: 500px) {
      .letter {
        padding: 1.8rem;
        font-size: 0.95rem;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>致我最爱的鑫鑫 💗</h1>
    <div class="heart">六年 · 慢慢亦漫漫</div>
    <div class="letter">
很开心我们出现在彼此的生命里，  
成为目前彼此很重要的人，离不开也不想离开的人。  

虽然我不是一个暖心的人，也会有坏脾气和不理解，  
但希望我在你眼里，我依然是很好的那个。  

可能慢慢我们的新鲜感会过、会产生倦意、会发现彼此的好多缺点。  
可“爱”是什么呢？  

爱是时间把所有掩体都拿掉，我还是依然毫不犹豫地想要在你身边。  

愿我们能享受热烈的新鲜感，也能经受住时光的打磨。  
对于我而言，你永远是星辰大海，无可代替。  

你不需要多完美，你只需要做你自己就好。  
我会慢慢又长长地爱你，周而复始，慢慢亦漫漫。
    </div>
    <div class="signature">
      —— 永远爱你的<br>小周<br>2026年1月24日
    </div>
  </div>
</body>
</html>
